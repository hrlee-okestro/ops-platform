---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ops.okestro.dev
  resources:
  - scheduledscalers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ops.okestro.dev
  resources:
  - scheduledscalers/finalizers
  verbs:
  - update
- apiGroups:
  - ops.okestro.dev
  resources:
  - scheduledscalers/status
  verbs:
  - get
  - patch
  - update
