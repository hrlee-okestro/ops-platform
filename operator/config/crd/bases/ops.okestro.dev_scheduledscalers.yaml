---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: scheduledscalers.ops.okestro.dev
spec:
  group: ops.okestro.dev
  names:
    kind: ScheduledScaler
    listKind: ScheduledScalerList
    plural: scheduledscalers
    singular: scheduledscaler
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ScheduledScaler는 시간대별로 Deployment의 replicas를 조정하는 정책 리소스이다.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec은 원하는 상태이다 (사용자가 씀).
            properties:
              override:
                description: |-
                  override가 있고 아직 until 전이면 시간표보다 우선해서 그 replicas로 맞춘다.
                  장애 조치(예: 승인된 "replicas를 3으로 올려라")를 CR 필드 하나로 표현하기 위한 것이다.
                properties:
                  replicas:
                    description: replicas는 until까지 고정할 replicas 수이다.
                    format: int32
                    minimum: 0
                    type: integer
                  until:
                    description: 'until은 이 지시가 유효한 마지막 시각이다 (RFC3339, 예: 2026-11-10T15:00:00Z).'
                    format: date-time
                    type: string
                required:
                - replicas
                - until
                type: object
              scaleDown:
                description: scaleDown은 replicas를 줄여 두는 구간이다. 구간 밖에서는 원래 replicas(status.originalReplicas)로
                  되돌린다.
                properties:
                  end:
                    description: end는 구간 종료 시각이다 (24시간제 "HH:MM"). 이 시각부터는 원래 replicas로
                      되돌린다.
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                  replicas:
                    description: replicas는 구간 안에서 유지할 replicas 수이다. 0이면 완전히 내린다.
                    format: int32
                    minimum: 0
                    type: integer
                  start:
                    description: start는 구간 시작 시각이다 (24시간제 "HH:MM").
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                required:
                - end
                - replicas
                - start
                type: object
              targetRef:
                description: targetRef는 조정할 Deployment이다.
                properties:
                  name:
                    description: name은 대상 Deployment의 이름이다.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              timezone:
                default: UTC
                description: 'timezone은 start/end를 해석할 IANA 시간대 이름이다 (예: Asia/Seoul).
                  생략하면 UTC이다.'
                type: string
            required:
            - scaleDown
            - targetRef
            type: object
          status:
            description: status는 관측한 현재 상태이다 (Operator가 씀).
            properties:
              conditions:
                description: |-
                  conditions는 리소스의 세부 상태 목록이다. 각 condition은 type별로 하나씩이며
                  상태 값은 True, False, Unknown 중 하나이다.
                  흔히 쓰는 type: Available(정상 동작), Progressing(변경 중), Degraded(원하는 상태에 못 도달).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastScaleTime:
                description: lastScaleTime은 Operator가 마지막으로 replicas를 바꾼 시각이다.
                format: date-time
                type: string
              originalReplicas:
                description: |-
                  originalReplicas는 줄이기 직전의 replicas이다. 구간이 끝나면 이 값으로 되돌린다.
                  0도 의미 있는 값이라 포인터로 둔다. nil이면 "아직 기록한 적 없음"이다.
                format: int32
                type: integer
              phase:
                description: phase는 지금 어느 구간인지를 나타낸다.
                enum:
                - Normal
                - ScaledDown
                - Overridden
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
