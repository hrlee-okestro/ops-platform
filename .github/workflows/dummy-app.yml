name: dummy-app

# dummy-app 코드가 바뀌면: 테스트 -> 이미지 빌드 -> Trivy 스캔 -> GHCR push -> manifests 태그 갱신.
# PR에서는 테스트만 돌리고 이미지는 만들지 않는다. main에 머지(push)될 때만 배포 흐름이 이어진다.
on:
  push:
    branches: [main]
    paths:
      - "dummy-app/**"
      - ".github/workflows/dummy-app.yml"
  pull_request:
    paths:
      - "dummy-app/**"
      - ".github/workflows/dummy-app.yml"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/hrlee-okestro/dummy-app
  MANIFESTS_REPO: hrlee-okestro/ops-platform-manifests

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        working-directory: dummy-app
        run: ./gradlew --no-daemon test

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # 클러스터 노드가 amd64라서 플랫폼을 명시한다. 스캔용으로 먼저 로컬에만 빌드한다 (push 안 함).
      - name: Build (scan용, push 안 함)
        uses: docker/build-push-action@v6
        with:
          context: dummy-app
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 수정 가능한 HIGH/CRITICAL 취약점이 있으면 여기서 실패하고 push하지 않는다.
      # 외부 액션(trivy-action)은 내부 의존 태그가 사라져 실패한 적이 있어, 공식 이미지를 직접 실행한다.
      - name: Trivy scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${IMAGE}:${TAG}"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: dummy-app
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha

      # manifests 저장소의 이미지 태그만 바꿔 커밋한다. 이 커밋을 ArgoCD가 감지해 배포한다.
      # 이 저장소에만 쓰기 권한이 있는 deploy key(MANIFESTS_DEPLOY_KEY)로 접근한다.
      - name: Checkout manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFESTS_REPO }}
          ssh-key: ${{ secrets.MANIFESTS_DEPLOY_KEY }}
          path: manifests

      - name: Bump image tag in manifests
        working-directory: manifests
        run: |
          sed -i "s/newTag: .*/newTag: ${TAG}/" workloads/dummy-app/kustomization.yaml
          if git diff --quiet; then
            echo "태그가 이미 ${TAG}입니다. 커밋할 것이 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(manifests): bump dummy-app to ${TAG}"
          # 다른 커밋이 먼저 들어왔을 수 있으니 rebase 후 push한다.
          git pull --rebase origin main
          git push origin HEAD:main
