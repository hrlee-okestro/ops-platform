name: operator

# operator 코드가 바뀌면: 테스트 -> 이미지 빌드 -> Trivy 스캔 -> GHCR push.
# PR에서는 테스트만 돌리고 이미지는 만들지 않는다. main에 머지(push)될 때만 이미지를 올린다.
# manifests의 이미지 태그 갱신은 workloads/operator가 만들어진 뒤에 이 파일에 단계를 추가한다.
on:
  push:
    branches: [main]
    paths:
      - "operator/**"
      - ".github/workflows/operator.yml"
  pull_request:
    paths:
      - "operator/**"
      - ".github/workflows/operator.yml"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/hrlee-okestro/ops-operator

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      # make test는 CRD/DeepCopy 생성, fmt, vet, envtest(가짜 API 서버) 테스트를 함께 실행한다.
      - name: Test
        working-directory: operator
        run: make test

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # 클러스터 노드가 amd64라서 플랫폼을 명시한다. 스캔용으로 먼저 로컬에만 빌드한다 (push 안 함).
      - name: Build (scan용, push 안 함)
        uses: docker/build-push-action@v6
        with:
          context: operator
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 수정 가능한 HIGH/CRITICAL 취약점이 있으면 여기서 실패하고 push하지 않는다.
      # 외부 액션 대신 공식 이미지를 직접 실행한다 (dummy-app.yml과 같은 이유).
      - name: Trivy scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${IMAGE}:${TAG}"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: operator
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
